<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>איגוד בחורים – ניהול</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark">אב</div>
        <div class="brand-text">
          <div class="brand-name">איגוד בחורים</div>
          <div class="brand-sub">מערכת ניהול</div>
        </div>
      </div>
      <div class="framework-block">
        <label class="framework-label" for="framework-select">מסגרת מוצגת</label>
        <select id="framework-select" class="framework-select"></select>
      </div>
      <div class="role-block" id="role-block"></div>
    </div>

    <nav class="nav" id="main-nav">
      <button class="nav-item" data-route="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9h14v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 19v-5h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>תא הטייס השבועי</span>
      </button>
      <button class="nav-item" data-route="roadmap">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M4 19 10 5l4 8 3-4 3 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>מפת דרכים שנתית</span>
      </button>
      <button class="nav-item" data-route="print">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="7" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="10" width="18" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="7" y="17" width="10" height="4" rx="0.5" stroke="currentColor" stroke-width="1.8"/></svg>

      <button class="nav-item" data-route="operator">

        <span>אחראי ליל שישי</span>
      </button>
      <button class="nav-item" data-route="students">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="9" r="2.3" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 20c.6-3.6 3-5.5 5.5-5.5s4.9 1.9 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15 20c.4-2.4 1.9-3.8 3.6-3.8s3 1.2 3.4 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>מצב הבחורים</span>
      </button>
      <button class="nav-item" data-route="admin" data-admin-only="true">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.5 7.5 0 0 0 0-3l1.9-1.3-2-3.4-2.2.7a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.5 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.2-.7-2 3.4L4.6 10.5a7.5 7.5 0 0 0 0 3L2.7 14.8l2 3.4 2.2-.7c.76.66 1.64 1.17 2.6 1.5l.5 2.5h4l.5-2.5a7.6 7.6 0 0 0 2.6-1.5l2.2.7 2-3.4-1.9-1.3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>

<div id="modal-root"></div>
<div id="print-root" class="print-only"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>

</html>
